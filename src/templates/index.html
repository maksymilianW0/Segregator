<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Konfigurator katalogów</title>

    <style>
        body {
            font-family: system-ui, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 40px;
        }

        h2, h3 {
            margin-bottom: 10px;
        }

        form {
            max-width: 700px;
            margin: auto;
            background: #111827;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        label {
            font-size: 14px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 14px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0b1220;
            color: #e2e8f0;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56,189,248,0.2);
        }

        .category {
            background: #0b1220;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 10px;
            margin-top: 12px;
            transition: 0.2s;
        }

        .category:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
        }

        button {
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-add {
            background: #38bdf8;
            color: #0f172a;
            margin-top: 10px;
        }

        .btn-add:hover {
            background: #0ea5e9;
        }

        .btn-submit {
            background: #22c55e;
            color: #0f172a;
            margin-top: 20px;
            width: 100%;
        }

        .btn-submit:hover {
            background: #16a34a;
        }

        .btn-remove {
            background: #ef4444;
            color: white;
            margin-top: 5px;
        }

        .btn-remove:hover {
            background: #dc2626;
        }

        .added {
            max-width: 650px;
        }

    </style>
</head>

<body>

<form method="POST" action="/submit">

    <h2>📁 Konfigurator katalogów</h2>

    <label>Ścieżka katalogu docelowego</label>
    <input type="text" name="target_path" required>

    <h3>📂 Kategorie</h3>

    <div id="categories"></div>

    <button type="button" class="btn-add" onclick="addCategory()">
        + Dodaj kategorię
    </button>

    <button type="submit" class="btn-submit">
        🚀 Wyślij
    </button>

</form>

<script>
function addCategory() {
    const container = document.getElementById("categories");

    const div = document.createElement("div");
    div.className = "category";

    div.innerHTML = `
        <label>Nazwa kategorii</label>
        <input type="text" name="category_name[]" class="added" required>

        <label>Ścieżka kategorii</label>
        <input type="text" name="category_path[]"  class="added" required>

        <label>Bind</label>
        <input type="text" name="category_bind[]"  class="added">

        <button type="button" class="btn-remove" onclick="this.parentElement.remove()">
            Usuń
        </button>
    `;

    container.appendChild(div);
}
</script>

</body>
</html>
